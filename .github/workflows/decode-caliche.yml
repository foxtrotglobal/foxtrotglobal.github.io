name: Decode caliche-ridge-notes assets

on:
  push:
    branches: [main]
    paths:
      - 'caliche-ridge-notes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit binaries
        run: |
          set -euo pipefail
          root="caliche-ridge-notes"
          test -d "$root"
          mkdir -p "$root/signs" "$root/data"
          changed=0
          decode_one() {
            local src="$1" dest="$2"
            base64 -d "$src" > /tmp/out.bin
            if [ -f "$dest" ] && cmp -s /tmp/out.bin "$dest"; then
              rm -f /tmp/out.bin
              return 0
            fi
            mv /tmp/out.bin "$dest"
            changed=1
          }
          for f in "$root"/signs/*.jpg.b64; do
            [ -e "$f" ] || continue
            decode_one "$f" "${f%.b64}"
          done
          if ls "$root"/texas-qr-parking-report.pdf.b64.* >/dev/null 2>&1; then
            cat "$root"/texas-qr-parking-report.pdf.b64.* | base64 -d > /tmp/out.bin
            dest="$root/texas-qr-parking-report.pdf"
            if [ ! -f "$dest" ] || ! cmp -s /tmp/out.bin "$dest"; then
              mv /tmp/out.bin "$dest"
              changed=1
            fi
          fi
          if [ -f "$root/data/texas-qr-parking-final.kmz.b64" ]; then
            decode_one "$root/data/texas-qr-parking-final.kmz.b64" "$root/data/texas-qr-parking-final.kmz"
          fi
          if [ "$changed" -eq 0 ]; then
            echo "Assets already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$root"
          git commit -m "Decode assets for caliche-ridge-notes"
          git push
